# Compila o app e gera o DynamicIslandApp.ipa (sem assinatura) na nuvem.
#
# Como usar:
# 1. Faça push deste branch para o GitHub
# 2. Vá em Actions → "Build IPA" → Run workflow (ou aguarde o push)
# 3. Baixe o artefato "DynamicIslandApp-ipa" na página do workflow
# 4. Instale no iPhone com o Sideloadly (Windows/Mac) ou AltStore,
#    usando seu Apple ID gratuito — eles assinam e instalam por você.
#
# O .ipa sai SEM assinatura porque a assinatura exige um certificado
# Apple vinculado ao seu Apple ID (isso só pode ser feito na sua máquina).

name: Build IPA

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select --switch /Applications/Xcode.app
          else
            LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
            echo "Usando $LATEST"
            sudo xcode-select --switch "$LATEST"
          fi
          xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild -project DynamicIslandApp/DynamicIslandApp.xcodeproj \
            -scheme DynamicIslandApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          APP_PATH=$(find build -name 'DynamicIslandApp.app' -type d | head -n 1)
          echo "App encontrado em: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r DynamicIslandApp.ipa Payload
          echo "IPA gerado:"
          ls -lh DynamicIslandApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandApp-ipa
          path: build/DynamicIslandApp.ipa
